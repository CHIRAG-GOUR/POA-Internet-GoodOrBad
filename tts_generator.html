<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTS Audio Generator — Internet Smart Adventure</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#090d16;color:#e2e8f0;min-height:100vh;padding:32px 20px}
.container{max-width:960px;margin:0 auto}
h1{font-family:'Fredoka',sans-serif;font-size:2.2rem;text-align:center;margin-bottom:8px;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;color:#94a3b8;margin-bottom:28px;font-size:0.95rem}

.panel{background:#131d31;border:1px solid #1e293b;border-radius:16px;padding:24px;margin-bottom:24px;box-shadow:0 10px 25px rgba(0,0,0,0.4)}
.panel-title{font-size:1.1rem;font-weight:700;color:#38bdf8;margin-bottom:16px;display:flex;align-items:center;gap:8px}

.config-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:768px){.config-grid{grid-template-columns:1fr}}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
label{font-size:0.85rem;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:0.5px}
input[type="text"], input[type="password"], select{background:#0b1120;border:1px solid #334155;border-radius:10px;padding:12px 14px;color:#f8fafc;font-size:0.95rem;outline:none;transition:border-color 0.2s}
input:focus, select:focus{border-color:#38bdf8}

.voice-preview-box{display:flex;align-items:center;gap:12px;margin-top:4px}
.btn-preview{background:#1e293b;color:#38bdf8;border:1px solid #38bdf8;padding:8px 16px;border-radius:8px;font-size:0.85rem;cursor:pointer;font-weight:600;transition:all 0.2s}
.btn-preview:hover{background:#38bdf8;color:#090d16}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{background:#131d31;border:1px solid #1e293b;border-radius:14px;padding:16px;text-align:center}
.stat .n{font-size:1.9rem;font-weight:700;color:#38bdf8;font-family:'Fredoka',sans-serif}
.stat .l{font-size:0.75rem;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;margin-top:2px}

.progress-wrap{background:#131d31;border:1px solid #1e293b;border-radius:14px;padding:20px;margin-bottom:24px}
.bar-outer{background:#1e293b;border-radius:10px;height:24px;overflow:hidden;margin:12px 0}
.bar-inner{background:linear-gradient(90deg,#3b82f6,#06b6d4,#10b981);height:100%;border-radius:10px;width:0%;transition:width 0.3s}
.bar-label{display:flex;justify-content:space-between;font-size:0.9rem;color:#94a3b8;font-weight:600}
#statusText{color:#f8fafc;font-size:0.95rem}

.controls{display:flex;justify-content:center;gap:16px;margin-bottom:24px}
.btn-primary{background:linear-gradient(135deg,#2563eb,#0284c7);color:#fff;border:none;padding:14px 36px;border-radius:12px;font-size:1.05rem;cursor:pointer;font-weight:700;box-shadow:0 6px 20px rgba(37,99,235,0.4);transition:all 0.2s}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(37,99,235,0.6)}
.btn-primary:disabled{background:#334155;color:#64748b;cursor:not-allowed;box-shadow:none;transform:none}
.btn-success{background:linear-gradient(135deg,#059669,#10b981);color:#fff;border:none;padding:14px 36px;border-radius:12px;font-size:1.05rem;cursor:pointer;font-weight:700;box-shadow:0 6px 20px rgba(16,185,129,0.4);display:none;transition:all 0.2s}
.btn-success:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(16,185,129,0.6)}

.line-list{max-height:480px;overflow-y:auto;background:#0b1120;border:1px solid #1e293b;border-radius:14px;padding:14px}
.line-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;margin:4px 0;font-size:0.85rem;background:#131d31;border:1px solid rgba(255,255,255,0.03)}
.line-item.done{background:#062817;border-color:#059669}
.line-item.active{background:#1e3a5f;border-color:#38bdf8}
.line-item.error{background:#3b1219;border-color:#dc2626}
.line-item .idx{color:#64748b;font-weight:700;width:28px}
.line-item .who-badge{padding:3px 10px;border-radius:6px;font-weight:700;font-size:0.75rem;text-transform:uppercase}
.who-badge.boy{background:#1e3a8a;color:#93c5fd}
.who-badge.girl{background:#831843;color:#f9a8d4}
.line-item .line-text{flex:1;color:#cbd5e1}
.line-item .line-audio{color:#64748b;font-size:0.75rem;font-family:monospace}
.line-item .status-icon{font-size:1.1rem}
</style>
</head>
<body>

<div class="container">
  <h1>🎙️ ElevenLabs Voice Studio</h1>
  <p class="sub">Generate and synchronize all 50 character dialogue lines for Internet Smart Adventure</p>

  <div class="panel">
    <div class="panel-title">⚙️ ElevenLabs API Configuration</div>
    <div class="field">
      <label for="apiKey">ElevenLabs API Key</label>
      <input type="password" id="apiKey" placeholder="Paste your ElevenLabs API Key here (sk_...)" autocomplete="off">
    </div>

    <div class="config-grid">
      <div class="field">
        <label for="boyVoice">👦 Boy Voice (Aarav - Kid Voice)</label>
        <select id="boyVoice">
          <option value="EeQEodFZVtBkjtgK3HBc" selected>Kid Voice Boy (Custom / POA Default - EeQEodFZVtBkjtgK3HBc)</option>
          <option value="ErXwobaYiN019PkySvjV">Antoni (Expressive & Friendly Young Male)</option>
          <option value="TxGEqnHWrfWFTfGW9XjX">Josh (Young & Enthusiastic Boy)</option>
          <option value="IKne3meq5aSn9XLyUdCD">Charlie (Upbeat & Energetic Kid)</option>
          <option value="pNInz6obpgDQGcFmaJgB">Adam (Smooth & Narrative Male)</option>
        </select>
        <div class="voice-preview-box">
          <button class="btn-preview" onclick="testVoice('boy')">▶ Test Boy Voice</button>
          <span id="boyVoiceStatus" style="font-size:0.8rem;color:#94a3b8"></span>
        </div>
      </div>

      <div class="field">
        <label for="girlVoice">👧 Girl Voice (Meera - Bella)</label>
        <select id="girlVoice">
          <option value="e3FEEanj39p8QCSMe8iV" selected>Bella (e3FEEanj39p8QCSMe8iV - POA Default)</option>
          <option value="EXAVITQu4vr4xnSDxMaL">Bella (Library Standard - EXAVITQu4vr4xnSDxMaL)</option>
          <option value="21m00Tcm4TlvDq8ikWAM">Rachel (Calm & Clear Young Female)</option>
          <option value="AZnzlk1XvdvUeBnXmlld">Domi (Bright & Playful Girl)</option>
        </select>
        <div class="voice-preview-box">
          <button class="btn-preview" onclick="testVoice('girl')">▶ Test Girl Voice</button>
          <span id="girlVoiceStatus" style="font-size:0.8rem;color:#94a3b8"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="n" id="totalLines">50</div><div class="l">Total Lines</div></div>
    <div class="stat"><div class="n" id="doneCount">0</div><div class="l">Generated</div></div>
    <div class="stat"><div class="n" id="totalChars">3,980</div><div class="l">Total Characters</div></div>
    <div class="stat"><div class="n" id="totalSize">0 KB</div><div class="l">Audio Size</div></div>
  </div>

  <div class="progress-wrap">
    <div class="bar-label"><span id="statusText">Ready to generate</span><span id="pctText">0%</span></div>
    <div class="bar-outer"><div class="bar-inner" id="bar"></div></div>
  </div>

  <div class="controls">
    <button class="btn-primary" id="startBtn" onclick="startGeneration()">🎙️ Generate All 50 Dialogues</button>
    <button class="btn-success" id="downloadBtn" onclick="downloadResult()">💾 Download Audio Pack & JSON</button>
  </div>

  <div class="line-list" id="lineList"></div>
</div>

<script>
const MODEL = "eleven_turbo_v2_5";
const FORMAT = "mp3_22050_32";

const LINES = [
  {id:"boy_000", who:"boy", audio:"audio/boy_000.mp3", text:"I use the internet almost every day — look, my laptop!"},
  {id:"boy_001", who:"boy", audio:"audio/boy_001.mp3", text:"Wait... is the internet ALWAYS good? Or are there bad things too?"},
  {id:"girl_002", who:"girl", audio:"audio/girl_002.mp3", text:"Let's find out — together. Come on, explorer!"},
  {id:"boy_003", who:"boy", audio:"audio/boy_003.mp3", text:"Whoa — the whole internet is waiting for us!"},
  {id:"girl_004", who:"girl", audio:"audio/girl_004.mp3", text:"Yes! But remember our question — is it ALWAYS good? Let's keep our eyes open."},
  {id:"boy_005", who:"boy", audio:"audio/boy_005.mp3", text:"So when I send a message, it travels all the way to a global server and back?!"},
  {id:"girl_006", who:"girl", audio:"audio/girl_006.mp3", text:"Exactly! Tap the glowing Data Packet to watch it travel forward and bring back the answer!"},
  {id:"boy_007", who:"boy", audio:"audio/boy_007.mp3", text:"Watch how fast it zooms from my laptop to the server and returns!"},
  {id:"boy_008", who:"boy", audio:"audio/boy_008.mp3", text:"Whoa! Look at all the things we can do on the internet!"},
  {id:"girl_009", who:"girl", audio:"audio/girl_009.mp3", text:"And we can CREATE and play too — not just watch. Tap every building to step inside and explore!"},
  {id:"boy_010", who:"boy", audio:"audio/boy_010.mp3", text:"We can learn and CREATE almost anything here. This is amazing!"},
  {id:"girl_011", who:"girl", audio:"audio/girl_011.mp3", text:"It really is. But… if the internet is this powerful, could some parts be risky too?"},
  {id:"boy_012", who:"boy", audio:"audio/boy_012.mp3", text:"Hmm. Let’s keep exploring and find out."},
  {id:"girl_013", who:"girl", audio:"audio/girl_013.mp3", text:"Here come different internet habits. Some are great… some, not so good."},
  {id:"boy_014", who:"boy", audio:"audio/boy_014.mp3", text:"Easy! Drag each one into GOOD CHOICE or NOT SO GOOD. Let’s sort them!"},
  {id:"boy_015", who:"boy", audio:"audio/boy_015.mp3", text:"That was easier than I thought! Good and not-so-good aren’t so hard to tell apart."},
  {id:"girl_016", who:"girl", audio:"audio/girl_016.mp3", text:"Sometimes though… the SAME thing can be good OR bad. Like gaming — a little is fun, too much isn’t."},
  {id:"boy_017", who:"boy", audio:"audio/boy_017.mp3", text:"Ohh. So it’s about balance. Let’s test that next!"},
  {id:"girl_018", who:"girl", audio:"audio/girl_018.mp3", text:"This is the Internet Balance Scale. Benefits on the left, risks on the right."},
  {id:"boy_019", who:"boy", audio:"audio/boy_019.mp3", text:"So if I add too many risky habits… the scale tips! Let’s test our moderation."},
  {id:"boy_020", who:"boy", audio:"audio/boy_020.mp3", text:"So the same activity can be good OR bad — it depends how much!"},
  {id:"girl_021", who:"girl", audio:"audio/girl_021.mp3", text:"Exactly. Too much of anything tips the balance. The trick is moderation."},
  {id:"boy_022", who:"boy", audio:"audio/boy_022.mp3", text:"Sometimes after staring at a screen for hours, my eyes sting, get red, and I get a headache."},
  {id:"girl_023", who:"girl", audio:"audio/girl_023.mp3", text:"Let us test our 3D Vision Simulator to see exactly what happens to eyes during long screen time and how to fix it!"},
  {id:"girl_025", who:"girl", audio:"audio/girl_025.mp3", text:"Welcome to the Privacy Locker! Some personal data must be locked in the Cyber Vault forever."},
  {id:"boy_026", who:"boy", audio:"audio/boy_026.mp3", text:"While other things like hobbies and avatars are fun to share. Let us sort them and see what happens!"},
  {id:"boy_027", who:"boy", audio:"audio/boy_027.mp3", text:"Locked and safe! My passwords and address are guarded in the Cyber Vault forever."},
  {id:"girl_028", who:"girl", audio:"audio/girl_028.mp3", text:"And my gamer avatar is ready for the world. Let us check out Scam Alley next!"},
  {id:"boy_029", who:"boy", audio:"audio/boy_029.mp3", text:"I just opened my messaging app on my laptop, and strange chat popups are appearing!"},
  {id:"girl_030", who:"girl", audio:"audio/girl_030.mp3", text:"Careful Aarav! Scammers use sneaky tricks. Let us inspect each message and reply wisely!"},
  {id:"girl_033", who:"girl", audio:"audio/girl_033.mp3", text:"Outstanding work! You stopped all three scam traps before they could do any harm."},
  {id:"boy_034", who:"boy", audio:"audio/boy_034.mp3", text:"Now let us see what happens when strangers message us during online gaming!"},
  {id:"girl_035", who:"girl", audio:"audio/girl_035.mp3", text:"We just launched PixelQuest Arena in our digital lounge. An unknown player started messaging our avatar."},
  {id:"boy_036", who:"boy", audio:"audio/boy_036.mp3", text:"Let us deploy our live in-game privacy tools to defend our identity and safety!"},
  {id:"boy_037", who:"boy", audio:"audio/boy_037.mp3", text:"All 3 stranger traps defeated! Personal identity, photo, and location stayed 100% safe!"},
  {id:"girl_038", who:"girl", audio:"audio/girl_038.mp3", text:"That uncomfortable feeling is the warning alarm. Block, report, and always tell trusted adults."},
  {id:"boy_039", who:"boy", audio:"audio/boy_039.mp3", text:"Welcome to the Truth Forensic Lab! Four viral news headlines need investigation."},
  {id:"girl_040", who:"girl", audio:"audio/girl_040.mp3", text:"Let us analyze the evidence, fill our Truth & Falsehood Meters, and determine our Forensic Level!"},
  {id:"boy_041", who:"boy", audio:"audio/boy_041.mp3", text:"Both meters are at 100%! We can spot fake viral stories and verify real science anytime."},
  {id:"girl_042", who:"girl", audio:"audio/girl_042.mp3", text:"Now let us see the entire global journey of the internet across our panoramic city!"},
  {id:"boy_043", who:"boy", audio:"audio/boy_043.mp3", text:"LOOK AT THE ENTIRE PANORAMIC DIGITAL CITY! We can see our home, the city 5G tower, the ocean cable terminal, and our school!"},
  {id:"girl_044", who:"girl", audio:"audio/girl_044.mp3", text:"Let us interactively route a data packet across the entire global internet highway!"},
  {id:"girl_045", who:"girl", audio:"audio/girl_045.mp3", text:"The internet connects our whole world at the speed of light."},
  {id:"boy_046", who:"boy", audio:"audio/boy_046.mp3", text:"And we have the superpowers to use it safely and creatively. Time to seal our rulebook!"},
  {id:"girl_051", who:"girl", audio:"audio/girl_051.mp3", text:"It is time to draft our 5 Golden Commandments of Digital Citizenship!"},
  {id:"boy_052", who:"boy", audio:"audio/boy_052.mp3", text:"Let us seal every rule onto our classroom golden charter!"},
  {id:"boy_054", who:"boy", audio:"audio/boy_054.mp3", text:"Our Golden Digital Rulebook is complete! Ready for the Final Challenge Arena!"},
  {id:"girl_055", who:"girl", audio:"audio/girl_055.mp3", text:"Let us test everything we learned!"},
  {id:"girl_056", who:"girl", audio:"audio/girl_056.mp3", text:"We did it! We explored the entire internet from undersea cables to cyber defense!"},
  {id:"boy_057", who:"boy", audio:"audio/boy_057.mp3", text:"One final moment to seal our Master Explorer badge — let’s finish strong!"}
];

const results = {};
let totalBytes = 0;
let doneN = 0;

// Render lines list
const listEl = document.getElementById('lineList');
LINES.forEach((ln, i) => {
  const div = document.createElement('div');
  div.className = 'line-item';
  div.id = 'item_' + ln.id;
  div.innerHTML = `
    <span class="idx">${i+1}</span>
    <span class="who-badge ${ln.who}">${ln.who}</span>
    <span class="line-text">${ln.text}</span>
    <span class="line-audio">${ln.audio}</span>
    <span class="status-icon" id="icon_${ln.id}">⏳</span>
  `;
  listEl.appendChild(div);
});

// Calculate total characters
const totalChars = LINES.reduce((acc, cur) => acc + cur.text.length, 0);
document.getElementById('totalChars').textContent = totalChars.toLocaleString();

async function testVoice(role) {
  const apiKey = document.getElementById('apiKey').value.trim();
  if(!apiKey){
    alert('Please enter your ElevenLabs API Key first to test voices!');
    return;
  }
  const voiceId = role === 'boy' ? document.getElementById('boyVoice').value : document.getElementById('girlVoice').value;
  const statusEl = document.getElementById(role + 'VoiceStatus');
  statusEl.textContent = 'Generating sample...';

  const testText = role === 'boy' 
    ? "Hi there explorer! I'm Aarav, and I'm ready to learn how the internet works!" 
    : "Hello! I'm Meera. Let's explore the cyber world together and stay safe!";

  try {
    const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}?output_format=${FORMAT}`, {
      method: 'POST',
      headers: {
        'xi-api-key': apiKey,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        text: testText,
        model_id: MODEL,
        voice_settings: { stability: 0.5, similarity_boost: 0.75 }
      })
    });
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      throw new Error(err.detail && err.detail.message || `HTTP ${res.status}`);
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    audio.play();
    statusEl.textContent = 'Playing sample! 🔊';
  } catch(e) {
    statusEl.textContent = 'Error: ' + e.message;
  }
}

async function startGeneration(){
  const apiKey = document.getElementById('apiKey').value.trim();
  if(!apiKey){
    alert('Please enter your ElevenLabs API Key to start audio generation!');
    return;
  }

  const boyVoice = document.getElementById('boyVoice').value;
  const girlVoice = document.getElementById('girlVoice').value;

  document.getElementById('startBtn').disabled = true;
  document.getElementById('statusText').textContent = 'Starting generation...';

  for(let i = 0; i < LINES.length; i++){
    const ln = LINES[i];
    const itemEl = document.getElementById('item_' + ln.id);
    const iconEl = document.getElementById('icon_' + ln.id);
    
    itemEl.className = 'line-item active';
    itemEl.scrollIntoView({behavior:'smooth', block:'nearest'});
    iconEl.textContent = '⚡';
    document.getElementById('statusText').textContent = `Generating ${i+1}/${LINES.length}: [${ln.id}] ${ln.who}...`;

    const voiceId = ln.who === 'boy' ? boyVoice : girlVoice;

    try {
      const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}?output_format=${FORMAT}`, {
        method: 'POST',
        headers: {
          'xi-api-key': apiKey,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          text: ln.text,
          model_id: MODEL,
          voice_settings: { stability: 0.5, similarity_boost: 0.75 }
        })
      });

      if(!res.ok){
        const err = await res.json().catch(()=>({}));
        throw new Error(err.detail && err.detail.message || `HTTP ${res.status}`);
      }

      const blob = await res.blob();
      const base64 = await blobToBase64(blob);
      results[ln.id] = {
        who: ln.who,
        audio: ln.audio,
        text: ln.text,
        base64: base64,
        size: blob.size
      };

      totalBytes += blob.size;
      doneN++;

      itemEl.className = 'line-item done';
      iconEl.textContent = '✅';
      
      document.getElementById('doneCount').textContent = doneN;
      document.getElementById('totalSize').textContent = (totalBytes / 1024).toFixed(1) + ' KB';
      const pct = Math.round((doneN / LINES.length) * 100);
      document.getElementById('bar').style.width = pct + '%';
      document.getElementById('pctText').textContent = pct + '%';

      // Small delay between calls to respect rate limits
      await new Promise(r => setTimeout(r, 200));

    } catch(e) {
      itemEl.className = 'line-item error';
      iconEl.textContent = '❌';
      document.getElementById('statusText').textContent = `Error on ${ln.id}: ${e.message}`;
      console.error(e);
      alert(`Error generating line ${ln.id}: ${e.message}`);
      document.getElementById('startBtn').disabled = false;
      return;
    }
  }

  document.getElementById('statusText').textContent = '🎉 All 50 lines generated successfully!';
  document.getElementById('downloadBtn').style.display = 'inline-block';
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => {
      const base64 = reader.result.split(',')[1];
      resolve(base64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function downloadResult(){
  const jsonStr = JSON.stringify(results, null, 2);
  const blob = new Blob([jsonStr], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'tts_audio_pack.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
</script>
</body>
</html>
